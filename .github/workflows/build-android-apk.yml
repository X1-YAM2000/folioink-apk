name: Build FolioInk Fat Zero-Lag Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Auto-Fix Manifest for AGP 8.2 & Ensure 64MB Uncompressed mmap Arena
        run: |
          sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml
          mkdir -p app/src/main/assets/cache
          if [ ! -f app/src/main/assets/cache/folioink_gpu_mmap_arena.bin ]; then
            dd if=/dev/urandom of=app/src/main/assets/cache/folioink_gpu_mmap_arena.bin bs=1M count=64
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Fat Uncompressed Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled Fat Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolioInk-Fat-ZeroLag-APK
          path: app/build/outputs/apk/debug/*.apk
