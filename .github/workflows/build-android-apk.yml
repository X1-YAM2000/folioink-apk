name: Build FolioInk Fat Zero-Lag Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Fat Uncompressed Debug & Release APK
        run: gradle assembleDebug assembleRelease

      - name: Upload Compiled Fat Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolioInk-Fat-ZeroLag-APK
          path: app/build/outputs/apk/**/*.apk
